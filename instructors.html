<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogiCola — For Instructors</title>
<style>
  html,body{margin:0;height:100%;background:#0b2438}
  iframe{display:block;border:0;width:100%;height:100%}
</style>
</head>
<body>
<!-- The instructor edition is the student app (index.html) with the instructor
     flag on: every proof builder and workbench is unlocked. Keeping one copy of
     the app means fixes reach both editions at once. -->
<iframe src="index.html?instructor=1" title="LogiCola — For Instructors" allow="clipboard-write"></iframe>
<script>
  // keep the page title in step with the app inside
  var f=document.querySelector('iframe');
  f.addEventListener('load',function(){ try{ f.contentWindow.focus(); }catch(e){} });
</script>
</body>
</html>
